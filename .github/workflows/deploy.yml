name: Deploy Backend & Frontend

on:
  push:
    branches:
      - feature-branch  # Le workflow se déclenche lors d'un push sur la branche feature-branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Récupère le code source du dépôt
      - name: Checkout repository
        uses: actions/checkout@v3

      # Configure QEMU pour le build multi-architecture
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      # Configure Docker Buildx pour construire les images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Se connecter au Scaleway Container Registry
      - name: Log in to Scaleway Container Registry
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login "${{ secrets.DOCKER_HOST }}" -u nologin --password-stdin > /dev/null 2>&1

      # Build et push de l'image Docker du back-end
      - name: Build and push backend image
        run: |
          docker build -t registry.scaleway.com/${{ secrets.DOCKER_HOST }}/backend:latest -f back/Dockerfile back
          docker push registry.scaleway.com/${{ secrets.DOCKER_HOST }}/backend:latest

      # Build et push de l'image Docker du front-end
      - name: Build and push frontend image
        run: |
          docker build -t registry.scaleway.com/${{ secrets.DOCKER_HOST }}/frontend:latest -f front/Dockerfile front
          docker push registry.scaleway.com/${{ secrets.DOCKER_HOST }}/frontend:latest
